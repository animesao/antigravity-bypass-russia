name: Regression checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies (x86_64)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Install Linux dependencies (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 qemu-user qemu-user-static binfmt-support
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64-static -L /usr/aarch64-linux-gnu -E LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu" >> $GITHUB_ENV
      - name: Isolated regression tests
        run: cargo test --locked --bin antigravity-bypass-russia --target ${{ matrix.target }}
      - name: Socket regression tests
        run: cargo test --locked --test socket_tests --target ${{ matrix.target }}
      - name: Official CLI profiles and rollback
        run: python tests/verify_cli_profiles.py --target ${{ matrix.target }}
      - name: Launcher compatibility
        run: python tests/verify_wrappers.py
      - name: macOS bundle format
        run: python tests/verify_macos_bundle.py
      - name: macOS source launcher
        run: python tests/verify_macos_source_bundle.py
      - name: Build executable for read-only smoke checks
        run: cargo build --locked --bin antigravity-bypass-russia --target ${{ matrix.target }}
      - name: Read-only CLI and diagnostic export
        run: python tests/verify_release.py target/${{ matrix.target }}/debug/antigravity-bypass-russia${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Install Python 3.9 for packaging compatibility
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Python 3.9 launcher and packaging checks
        if: runner.os == 'Windows'
        run: |
          foreach ($check in @('verify_macos_bundle.py', 'verify_macos_source_bundle.py', 'verify_wrappers.py')) {
            python "tests/$check"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
